[project]
name = "ticketsort"
version = "0.1.0"
description = "TicketSort: label support tickets with a model and prove how well it works."
requires-python = ">=3.12"
dependencies = [
    "google-genai>=3.6.1",
    "pydantic>=2.14.4",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
# The tests import load.py, label.py and the rest from this folder.
pythonpath = ["."]
testpaths = ["tests"]
